<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif">
  <!-- Zepp New Taipei 示意地圖（不是真實比例）：新北大道、捷運新莊站 1 號出口、宏匯廣場、公車站、步行路線
       色碼與 scss/_variables.scss 一致：機櫃黑 #111114、舞池灰 #1D1D22、掃描線 #2E2E36、極光綠 #4DFF88、霓虹粉 #FF3D9E、紫外青 #3DE6FF -->
  <rect width="800" height="500" fill="#111114"/>
  <!-- 背景格線 -->
  <g stroke="#1D1D22" stroke-width="1">
    <path d="M0 50H800M0 100H800M0 150H800M0 200H800M0 250H800M0 300H800M0 350H800M0 400H800M0 450H800"/>
    <path d="M50 0V500M100 0V500M150 0V500M200 0V500M250 0V500M300 0V500M350 0V500M400 0V500M450 0V500M500 0V500M550 0V500M600 0V500M650 0V500M700 0V500M750 0V500"/>
  </g>
  <!-- 道路 -->
  <g fill="#2E2E36">
    <rect x="0" y="300" width="800" height="36"/>
    <rect x="148" y="0" width="22" height="500"/>
    <rect x="610" y="0" width="18" height="500"/>
  </g>
  <text x="300" y="324" fill="#A8A8B3" font-size="15" letter-spacing="3">新北大道四段</text>
  <!-- 宏匯廣場（街廓） -->
  <path d="M330 90H580V270H330Z" fill="#1D1D22" stroke="#4A4A55"/>
  <text x="400" y="120" fill="#A8A8B3" font-size="15">宏匯廣場</text>
  <!-- 場地：Zepp New Taipei（切角方塊） -->
  <path d="M420 160H520L544 184V250H444L420 226Z" fill="#4DFF88"/>
  <text x="482" y="212" fill="#000000" font-size="15" font-weight="700" text-anchor="middle">Zepp</text>
  <text x="482" y="232" fill="#000000" font-size="12" text-anchor="middle">New Taipei</text>
  <!-- 捷運新莊站 1 號出口 -->
  <circle cx="159" cy="370" r="16" fill="#3DE6FF"/>
  <text x="159" y="375" fill="#000000" font-size="15" font-weight="700" text-anchor="middle">M</text>
  <text x="186" y="392" fill="#3DE6FF" font-size="14">捷運新莊站 1 號出口</text>
  <!-- 公車站：宏匯廣場站 -->
  <rect x="566" y="276" width="22" height="22" fill="#F4F4F6"/>
  <path d="M571 281h12v9h-12z" fill="#111114"/>
  <text x="596" y="274" fill="#F4F4F6" font-size="13" text-anchor="start">公車宏匯廣場站</text>
  <!-- 步行路線（虛線）＋時間 -->
  <path d="M175 360H260V285H400V250" fill="none" stroke="#FF3D9E" stroke-width="4" stroke-dasharray="10 8" stroke-linecap="square"/>
  <text x="272" y="276" fill="#FF3D9E" font-size="14" font-weight="700">步行 8 分鐘</text>
  <!-- 指北 -->
  <g transform="translate(740 60)">
    <circle r="22" fill="none" stroke="#4A4A55"/>
    <path d="M0 -15L7 6H-7Z" fill="#F4F4F6"/>
    <text y="40" fill="#A8A8B3" font-size="12" text-anchor="middle">北</text>
  </g>
</svg>
