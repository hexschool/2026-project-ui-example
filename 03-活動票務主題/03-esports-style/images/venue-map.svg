<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif">
  <!-- Zepp New Taipei 戰術地圖（示意，不是真實比例）：新北大道四段、捷運新莊站 1 號出口、宏匯廣場、宏匯廣場公車站、步行路線
       右上角 x 460–800、y 0–200 只有街廓，活動細節頁會把場地照片疊在這裡（≥ 768px）
       色碼與 scss/_variables.scss 一致：曜石灰 #0B0E13、碳纖維 #12171E、浮起面 #1A212A、槍灰 #253040、控制項 #5E7088、
       鋼白 #E6EDF5、次要 #A3B1C2、金屬藍 #3D9BFF、亮端 #8CCBFF、$void #05111F -->
  <defs>
    <!-- 藍圖格線：40px 小格、200px 大格 -->
    <pattern id="grid-s" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#3D9BFF" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <pattern id="grid-l" width="200" height="200" patternUnits="userSpaceOnUse">
      <path d="M200 0H0V200" fill="none" stroke="#3D9BFF" stroke-opacity=".14" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#3D9BFF" stop-opacity=".45"/>
      <stop offset="1" stop-color="#3D9BFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="#0B0E13"/>
  <rect width="800" height="600" fill="url(#grid-s)"/>
  <rect width="800" height="600" fill="url(#grid-l)"/>

  <!-- 街廓（暗色塊） -->
  <g fill="#12171E" stroke="#253040" stroke-width="1">
    <rect x="40" y="40" width="210" height="150"/>
    <rect x="290" y="40" width="190" height="150"/>
    <rect x="40" y="290" width="210" height="170"/>
    <rect x="610" y="40" width="150" height="150"/>
    <rect x="610" y="290" width="150" height="170"/>
    <rect x="40" y="532" width="210" height="88"/>
    <rect x="300" y="532" width="270" height="88"/>
    <rect x="610" y="532" width="150" height="88"/>
  </g>

  <!-- 道路：槍灰雙線 -->
  <g fill="none" stroke="#5E7088" stroke-width="2">
    <!-- 新北大道四段（橫向主幹道） -->
    <path d="M0 222H800M0 262H800"/>
    <!-- 南北向道路 -->
    <path d="M262 0V222M262 262V600M278 0V222M278 262V600"/>
    <path d="M582 0V222M582 262V600M598 0V222M598 262V600"/>
  </g>
  <!-- 巷道：單線 -->
  <path d="M0 496H262M278 496H582M598 496H800" fill="none" stroke="#5E7088" stroke-opacity=".6" stroke-width="1.5"/>
  <!-- 道路中線 -->
  <path d="M0 242H800" stroke="#253040" stroke-width="2" stroke-dasharray="14 10"/>

  <!-- 宏匯廣場（場地所在的建物） -->
  <rect x="300" y="290" width="270" height="170" fill="#1A212A" stroke="#3D9BFF" stroke-opacity=".55" stroke-width="1.5"/>
  <path d="M300 290h18M300 290v18M570 290h-18M570 290v18M300 460h18M300 460v-18M570 460h-18M570 460v-18" stroke="#8CCBFF" stroke-width="3" fill="none"/>

  <!-- 步行路線：捷運新莊站 1 號出口 → 沿新北大道 → 宏匯廣場入口（金屬藍虛線） -->
  <path d="M150 252H372V300" fill="none" stroke="#8CCBFF" stroke-width="4" stroke-linecap="square" stroke-dasharray="10 8"/>

  <!-- 捷運新莊站 1 號出口 -->
  <g>
    <rect x="130" y="232" width="40" height="40" fill="#05111F" stroke="#8CCBFF" stroke-width="2"/>
    <text x="150" y="259" fill="#8CCBFF" font-size="18" font-weight="700" text-anchor="middle">M</text>
  </g>

  <!-- 公車站：宏匯廣場站 -->
  <g>
    <rect x="452" y="268" width="32" height="20" fill="#05111F" stroke="#A3B1C2" stroke-width="1.5"/>
    <path d="M458 275h20M458 281h20" stroke="#A3B1C2" stroke-width="2"/>
  </g>

  <!-- 場地標記：六角標＋光暈 -->
  <circle cx="372" cy="352" r="62" fill="url(#glow)"/>
  <polygon points="372,318 401,335 401,369 372,386 343,369 343,335" fill="#05111F" stroke="#8CCBFF" stroke-width="3"/>
  <polygon points="372,331 390,341 390,363 372,373 354,363 354,341" fill="#3D9BFF"/>

  <!-- 文字標註：深色描邊讓字在格線上也清楚 -->
  <g font-size="14" font-weight="500" fill="#E6EDF5" stroke="#0B0E13" stroke-width="5" stroke-linejoin="round" paint-order="stroke">
    <text x="40" y="212">新北大道四段</text>
    <text x="40" y="312">捷運新莊站 1 號出口</text>
    <text x="196" y="300" fill="#8CCBFF" font-size="13">步行約 8 分鐘</text>
    <text x="420" y="330" font-size="17" font-weight="700">Zepp New Taipei</text>
    <text x="420" y="352" fill="#A3B1C2" font-size="13">宏匯廣場內</text>
    <text x="494" y="284" fill="#A3B1C2" font-size="13">宏匯廣場站</text>
    <text x="312" y="448" fill="#A3B1C2" font-size="13">宏匯廣場</text>
  </g>

  <!-- 指北針 -->
  <g transform="translate(730 410)">
    <circle r="22" fill="#05111F" stroke="#5E7088" stroke-width="1.5"/>
    <path d="M0 -15L7 6H-7Z" fill="#3D9BFF"/>
    <text y="-28" fill="#E6EDF5" font-size="13" font-weight="700" text-anchor="middle">N</text>
  </g>
</svg>
