<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 每頁改：title、description -->
  <title>頁面名稱｜StageOne 城市現場</title>
  <meta name="description" content="StageOne 城市現場：專為中小型現場活動打造的售票平台。設計稿 04｜當代雙年展。">
  <meta name="theme-color" content="#FFFFFF">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <!-- 字體：Archivo（英數、價格、倒數，可變字寬）＋ Noto Sans TC（中文 400／500／700／900） -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!--
    ============================================================
    頁面骨架（5 個頁面共用）
    - 頁首、頁尾、登入 Modal 在每一頁都完整寫一份；改了這份範本後，5 個 .html 要一起改，
      改完執行 npm run check 確認都與範本一致（比對範圍：<head>、頁首、頁尾到 </html>，含登入 Modal）。
    - 頁首：桌機左側品牌＋主導覽、右側搜尋／登入／我要辦活動；992px 以下收進選單。
      搜尋按鈕有兩顆（手機在選單按鈕旁、桌機在右側），都打開頁首下方同一條搜尋列（#siteSearch）。
    - 每頁只需要調整一處「目前頁面」標示：目前頁的 <a class="nav-link"> 加 active 與 aria-current="page"
      · 活動細節（event.html）：「活動列表」加 active，但不加 aria-current
      · 購票確認（checkout.html）、設計 Guideline 不標示目前頁
    ============================================================
  -->
  <!-- 內容較短的頁面，頁尾也貼齊視窗底部 -->
  <div class="d-flex flex-column min-vh-100">
    <a class="skip-link" href="#main">跳至主要內容</a>

    <header class="site-header">
      <nav class="navbar navbar-expand-lg" aria-label="主要導覽">
        <div class="container">
          <!-- 品牌：5 根條碼＋字標（條碼是本風格的招牌母題） -->
          <a class="navbar-brand site-brand" href="index.html">
            <svg class="site-brand-mark" viewBox="0 0 22 28" aria-hidden="true" focusable="false"><path fill="currentColor" d="M0 0h3v28H0zM4 0h1v28H4zM6 0h2v28H6zM10 0h1v28h-1zM12 0h4v28h-4zM18 0h1v28h-1zM20 0h2v28h-2z"/></svg>
            <span class="site-brand-name">StageOne</span>
            <span class="site-brand-sub">城市現場</span>
          </a>

          <!-- 992px 以下：搜尋＋選單按鈕 -->
          <div class="d-flex d-lg-none align-items-center">
            <button class="site-icon-btn" type="button" data-bs-toggle="collapse" data-bs-target="#siteSearch" aria-controls="siteSearch" aria-expanded="false" aria-label="搜尋活動">
              <i class="bi bi-search" aria-hidden="true"></i>
            </button>
            <button class="navbar-toggler site-icon-btn" type="button" data-bs-toggle="collapse" data-bs-target="#siteNav" aria-controls="siteNav" aria-expanded="false" aria-label="開啟選單">
              <i class="bi bi-list" aria-hidden="true"></i>
            </button>
          </div>

          <div id="siteNav" class="collapse navbar-collapse">
            <!-- 主導覽：目前頁反白（黑底白字） -->
            <ul class="navbar-nav site-nav">
              <li class="nav-item"><a class="nav-link" href="index.html">首頁</a></li>
              <li class="nav-item"><a class="nav-link" href="events.html">活動列表</a></li>
            </ul>
            <!-- 右側：搜尋（只在桌機）→ 登入／註冊 → 我要辦活動 -->
            <div class="site-header-actions">
              <button class="btn btn-text site-search-toggle d-none d-lg-inline-flex" type="button" data-bs-toggle="collapse" data-bs-target="#siteSearch" aria-controls="siteSearch" aria-expanded="false">
                <i class="bi bi-search" aria-hidden="true"></i>搜尋
              </button>
              <button class="btn btn-text" type="button" data-bs-toggle="modal" data-bs-target="#loginModal">登入／註冊</button>
              <a class="btn btn-primary btn-sm" href="index.html#organizer">我要辦活動</a>
            </div>
          </div>
        </div>
      </nav>

      <!-- 點「搜尋」後展開的搜尋列（所有寬度共用） -->
      <div id="siteSearch" class="collapse site-search">
        <div class="container">
          <form class="site-search-form" role="search" action="events.html">
            <label class="visually-hidden" for="siteSearchInput">搜尋活動</label>
            <i class="bi bi-search" aria-hidden="true"></i>
            <input id="siteSearchInput" class="form-control" type="search" name="q" placeholder="想看什麼？試試「爵士」、「書展」或「高雄」">
            <button class="btn btn-primary" type="submit">搜尋活動</button>
          </form>
        </div>
      </div>
    </header>

    <main id="main" class="flex-grow-1" tabindex="-1">
      <!-- ============ 頁面內容從這裡開始 ============ -->

      <!-- ============ 頁面內容到這裡結束 ============ -->
    </main>

    <footer class="site-footer on-ink">
      <div class="container">
        <div class="row gy-5">
          <div class="col-lg-4">
            <a class="site-brand" href="index.html">
              <svg class="site-brand-mark" viewBox="0 0 22 28" aria-hidden="true" focusable="false"><path fill="currentColor" d="M0 0h3v28H0zM4 0h1v28H4zM6 0h2v28H6zM10 0h1v28h-1zM12 0h4v28h-4zM18 0h1v28h-1zM20 0h2v28h-2z"/></svg>
              <span class="site-brand-name">StageOne</span>
              <span class="site-brand-sub">城市現場</span>
            </a>
            <!-- Notion 主題介紹原句 -->
            <p class="site-footer-lead">三步完成購票、票券直接長在手機裡<br>專為中小型現場活動打造的售票平台。</p>
          </div>
          <!-- 我的票券、主辦方後台等是第二階段頁面：不帶 href 的佔位連結 -->
          <div class="col-6 col-md-4 col-lg-2 offset-lg-2">
            <h2 class="site-footer-title">購票者</h2>
            <ul class="list-unstyled site-footer-links">
              <li><a href="events.html">探索活動</a></li>
              <li><a>我的票券</a></li>
              <li><a>購票紀錄</a></li>
              <li><a>追蹤的主辦方</a></li>
            </ul>
          </div>
          <div class="col-6 col-md-4 col-lg-2">
            <h2 class="site-footer-title">主辦方</h2>
            <ul class="list-unstyled site-footer-links">
              <li><a href="index.html#organizer">我要辦活動</a></li>
              <li><a>主辦方後台</a></li>
              <li><a>行動驗票工具</a></li>
              <li><a>售票儀表板</a></li>
            </ul>
          </div>
          <div class="col-6 col-md-4 col-lg-2">
            <h2 class="site-footer-title">服務</h2>
            <ul class="list-unstyled site-footer-links">
              <li><a href="event.html#faq">購票須知</a></li>
              <li><a href="event.html#faq">退票規則</a></li>
              <li><a href="event.html#faq">常見問題</a></li>
              <li><a>聯絡我們</a></li>
            </ul>
          </div>
        </div>

        <!-- 巨型條碼：Code 128「StageOne」（scripts/make-barcode.mjs 產生），滿版心寬，當作全站的簽名 -->
        <div class="site-footer-barcode">
          <svg class="barcode" viewBox="0 0 123 1" preserveAspectRatio="none" aria-hidden="true" focusable="false"><path fill="currentColor" d="M0 0h2v1h-2zM3 0h1v1h-1zM6 0h1v1h-1zM11 0h2v1h-2zM14 0h3v1h-3zM18 0h1v1h-1zM22 0h1v1h-1zM25 0h4v1h-4zM30 0h1v1h-1zM33 0h1v1h-1zM36 0h1v1h-1zM38 0h2v1h-2zM44 0h1v1h-1zM47 0h2v1h-2zM50 0h1v1h-1zM55 0h1v1h-1zM57 0h2v1h-2zM61 0h1v1h-1zM66 0h1v1h-1zM70 0h3v1h-3zM74 0h2v1h-2zM77 0h2v1h-2zM83 0h1v1h-1zM85 0h1v1h-1zM88 0h1v1h-1zM90 0h2v1h-2zM94 0h1v1h-1zM99 0h3v1h-3zM103 0h1v1h-1zM107 0h2v1h-2zM110 0h2v1h-2zM115 0h3v1h-3zM119 0h1v1h-1zM121 0h2v1h-2z"/></svg>
          <p class="site-footer-copy">© 2026 StageOne 城市現場｜<wbr>本站為課程設計稿範例，活動與票券皆為示意資料。</p>
        </div>
      </div>
    </footer>
  </div>

  <!--
    登入 Modal（全站共用）：頁首「登入／註冊」、首頁「免費開賣我的第一場」都打開它
    設計稿沒有後端：「登入」「註冊新帳號」都只關閉 Modal
  -->
  <div class="modal fade login-modal" id="loginModal" tabindex="-1" aria-labelledby="loginModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title" id="loginModalTitle">登入／註冊</h2>
          <button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="關閉"></button>
        </div>
        <div class="modal-body">
          <!-- Notion「未登入點擊購票」逐字 -->
          <p class="login-modal-lead">登入後就能買票，註冊只要 30 秒。</p>
          <form>
            <div class="mb-3">
              <label class="form-label" for="loginEmail">Email</label>
              <input id="loginEmail" class="form-control" type="email" autocomplete="email">
            </div>
            <div class="mb-4">
              <label class="form-label" for="loginPassword">密碼</label>
              <input id="loginPassword" class="form-control" type="password" autocomplete="current-password">
            </div>
            <div class="d-grid gap-2">
              <button class="btn btn-primary" type="button" data-bs-dismiss="modal">登入</button>
              <button class="btn btn-outline-dark" type="button" data-bs-dismiss="modal">註冊新帳號</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="js/vendor/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
