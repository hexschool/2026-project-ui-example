<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>設計稿預覽｜UI 風格範例站</title>
  <meta name="description" content="六角學院 2026 專題班 UI 風格範例站的設計稿預覽：在外框裡瀏覽各主題類型與風格的範例頁面，可以換頁、換裝置寬度、換風格。">
  <meta name="theme-color" content="#ffffff">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
  <link rel="stylesheet" href="_overview/overview.css">
  <link rel="stylesheet" href="_overview/preview.css">
</head>
<body class="pv">
  <!--
    預覽頁：所有設計稿都放在這個外框的 iframe 裡看，避免被當成真的網站
    - 主題、風格、頁面的資料在 _overview/catalog.js；行為在 _overview/preview.js；樣式在 _overview/preview.css
    - 網址的 # 後面是目前的設計稿，例如 preview.html#ecommerce/02-muji-style/products
    - 直接打開某一頁設計稿時，_overview/frame-guard.js 會轉到這裡
  -->
  <header class="pv-bar">
    <button class="btn pv-open" type="button" id="openDirectory" aria-haspopup="dialog">
      <svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 2h5v5H2zM9 2h5v5H9zM2 9h5v5H2zM9 9h5v5H9z"/></svg>總目錄
    </button>

    <div class="pv-heading">
      <h1 class="pv-title">
        <span class="pv-theme" id="themeName">主題類型</span>
        <span class="pv-style" id="styleName">風格</span>
      </h1>
      <p class="pv-label"><strong>設計稿範例</strong><span class="pv-fiction">虛構品牌，</span>請勿輸入真實資料</p>
    </div>

    <label class="pv-page">
      <span class="visually-hidden">頁面</span>
      <select id="pageSelect"></select>
    </label>

    <div class="pv-device" role="group" aria-label="預覽寬度">
      <button type="button" data-device-button="full" aria-pressed="true">桌機</button>
      <button type="button" data-device-button="tablet" aria-pressed="false">平板 <span class="num">768</span></button>
      <button type="button" data-device-button="phone" aria-pressed="false">手機 <span class="num">390</span></button>
    </div>

    <div class="pv-nav">
      <a class="btn" id="prevStyle" data-label="上一套"><svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M10 3 5 8l5 5"/></svg><span class="pv-nav-text">上一套</span></a>
      <a class="btn" id="nextStyle" data-label="下一套"><span class="pv-nav-text">下一套</span><svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m6 3 5 5-5 5"/></svg></a>
    </div>

    <a class="btn pv-source" id="sourceLink" href="https://github.com/hexschool/2026-project-ui-example" target="_blank" rel="noopener">原始碼<svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9.5 2.5h4v4M13.5 2.5 7 9M12 9.5v4H2.5V4H6.5"/></svg><span class="visually-hidden">（另開新分頁）</span></a>
  </header>

  <main class="pv-canvas" id="canvas" data-device="full">
    <div class="pv-frame">
      <noscript><p>預覽需要 JavaScript。請開啟後重新整理，或回到<a href="index.html">範例站首頁</a>。</p></noscript>
      <p id="missing" hidden>總目錄裡沒有這一頁。新增的頁面或風格要先在 _overview/catalog.js 登記；如果是自己複製出來改的頁面，刪掉 &lt;head&gt; 裡載入 frame-guard.js 的兩行就能直接打開。<a href="index.html#directory">回總目錄</a></p>
      <!-- name 固定是 ui-preview，frame-guard.js 靠它分辨是不是在這個外框裡 -->
      <iframe id="frame" name="ui-preview" title="設計稿範例"></iframe>
    </div>
  </main>

  <dialog class="pv-dir" id="directory" aria-labelledby="directory-title">
    <div class="pv-dir-inner">
      <div class="pv-dir-head">
        <h2 id="directory-title">總目錄</h2>
        <a href="index.html">範例站首頁</a>
        <form method="dialog"><button class="btn">關閉</button></form>
      </div>
      <div data-directory data-home="index.html"></div>
    </div>
  </dialog>

  <script src="_overview/catalog.js"></script>
  <script src="_overview/directory.js"></script>
  <script src="_overview/preview.js"></script>
</body>
</html>
