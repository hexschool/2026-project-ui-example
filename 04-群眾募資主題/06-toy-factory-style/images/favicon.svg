<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="島造">
  <!-- 島造｜06 童話玩具工場：三塊積木（櫻、紫、黃）疊成小島，頂端一顆葡萄紫小球；也當頁首、頁尾的 Logo 標誌 -->
  <rect width="48" height="48" rx="14" fill="#FFF1F5"/>
  <!-- 海浪 -->
  <path d="M5 41.5c2.5 0 2.5-1.8 5-1.8s2.5 1.8 5 1.8 2.5-1.8 5-1.8 2.5 1.8 5 1.8 2.5-1.8 5-1.8 2.5 1.8 5 1.8 2.5-1.8 5-1.8 2.5 1.8 5 1.8" fill="none" stroke="#9B7BE0" stroke-width="2" stroke-linecap="round"/>
  <!-- 底層：櫻花粉積木 -->
  <rect x="6.5" y="29" width="35" height="8.5" rx="3" fill="#F28DB2" stroke="#3B2347" stroke-width="1.75"/>
  <circle cx="14" cy="33.25" r="1.4" fill="#3B2347" opacity=".18"/>
  <circle cx="34" cy="33.25" r="1.4" fill="#3B2347" opacity=".18"/>
  <!-- 中層：馬卡龍紫積木 -->
  <rect x="11.5" y="21" width="25" height="8" rx="3" fill="#B79BF0" stroke="#3B2347" stroke-width="1.75"/>
  <!-- 頂層：檸檬黃積木 -->
  <rect x="17" y="13.5" width="14" height="7.5" rx="2.75" fill="#FFE45E" stroke="#3B2347" stroke-width="1.75"/>
  <!-- 葡萄紫小球 -->
  <circle cx="24" cy="8.25" r="4.75" fill="#6C43C6" stroke="#3B2347" stroke-width="1.5"/>
  <circle cx="22.4" cy="6.7" r="1.4" fill="#FFFFFF"/>
</svg>
